name: YouTube videolarini yangilash

on:
  schedule:
    - cron: "17 * * * *"   # har soatda
  workflow_dispatch:        # Actions bo'limidan qo'lda ham ishga tushirish mumkin

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lentadan videolarni olish
        run: python scripts/fetch_videos.py
      - name: O'zgarish bo'lsa saqlash
        run: |
          if [[ -n "$(git status --porcelain data/videos.json)" ]]; then
            git config user.name "tinchlikmi-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Yangi videolar: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "Yangi video yo'q"
          fi
